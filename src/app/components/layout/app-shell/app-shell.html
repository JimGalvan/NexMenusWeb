<div class="shell">
  <aside class="shell__side">
    <div class="shell__brand">
      <app-brand-logo [size]="20" />
    </div>

    <nav class="shell__nav" aria-label="Primary">
      <a routerLink="/app/menus" routerLinkActive="is-active" class="shell__nav-link">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <span>Menus</span>
      </a>
      <a routerLink="/app/share" routerLinkActive="is-active" class="shell__nav-link">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="4" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.9"/>
          <rect x="14" y="4" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.9"/>
          <rect x="4" y="14" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.9"/>
          <path d="M14 14h3v3M20 14v6M17 20h3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <span>Share &amp; Print</span>
      </a>
      <a routerLink="/app/account" routerLinkActive="is-active" class="shell__nav-link">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.9"/>
          <path d="M5 20a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <span>Account</span>
      </a>
    </nav>

    <a routerLink="/app/account" class="shell__user">
      <span class="shell__avatar">{{ initials() }}</span>
      <span class="shell__user-text">
        <span class="shell__user-name">{{ accountEmail() }}</span>
        <span class="shell__user-email">{{ accountEmail() }}</span>
      </span>
    </a>
  </aside>
  <header class="shell__top">
    <app-brand-logo [size]="19" />
    <a routerLink="/app/account" class="shell__avatar">{{ initials() }}</a>
  </header>

  <main class="shell__content scrollarea">
    <router-outlet />
  </main>

  <nav class="shell__tabs">
    <a routerLink="/app/menus" routerLinkActive="is-active" class="shell__tab">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <span>Menus</span>
    </a>
    <a routerLink="/app/share" routerLinkActive="is-active" class="shell__tab">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="4" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.9"/>
        <rect x="14" y="4" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.9"/>
        <rect x="4" y="14" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.9"/>
        <path d="M14 14h3v3M20 14v6M17 20h3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <span>Share &amp; Print</span>
    </a>
    <a routerLink="/app/account" routerLinkActive="is-active" class="shell__tab">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.9"/>
        <path d="M5 20a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <span>Account</span>
    </a>
  </nav>
</div>
