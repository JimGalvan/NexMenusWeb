<div class="crop-screen">
  <div class="crop-screen__header">
    <button type="button" class="crop-screen__cancel" (click)="cancel()">Cancel</button>
    <div class="crop-screen__title">{{ title() }}</div>
    <button type="button" class="crop-screen__done" (click)="confirm()">Done</button>
  </div>

  <div #stageWrap class="crop-screen__stage-wrap">
    <div #stage class="crop-screen__stage" [class.is-round]="round()">
      <img #img [src]="imageSrc()" crossorigin="anonymous" />
      @if (!round()) {
        <div class="crop-screen__grid">
          <span class="crop-screen__grid-v" style="left:33.33%"></span>
          <span class="crop-screen__grid-v" style="left:66.66%"></span>
          <span class="crop-screen__grid-h" style="top:33.33%"></span>
          <span class="crop-screen__grid-h" style="top:66.66%"></span>
        </div>
      }
    </div>
  </div>

  <div class="crop-screen__zoom">
    <div class="crop-screen__zoom-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#9CA3AF" stroke-width="2"/><path d="M11 8v6M8 11h6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/><path d="m20 20-3.5-3.5" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="range" [min]="zoomMin" [max]="zoomMax" step="0.01" [value]="zoomValue()" (input)="onZoomInput($event)" />
    </div>
    <div class="crop-screen__hint">Drag to reposition, pinch or use the slider to zoom</div>
  </div>
</div>
