<div class="account">
    <header class="account__head">
        <h1>Account</h1>
        <p>Your profile, plan and settings.</p>
    </header>

    <!-- profile -->
    <section class="profile">
        <div class="profile__avatar">{{ initials() }}</div>
        <div class="profile__id">
            <div class="profile__name">{{ name() }}</div>
            <div class="profile__email">{{ email() }}</div>
        </div>
        <!--        TODO: implement Edit profile-->
        <!--        <span class="profile__edit">Edit</span>-->
    </section>

    <!-- plan -->
    <!-- TODO: implement Plan -->
    <!--    <section class="plan">-->
    <!--        <div>-->
    <!--            <div class="plan__label">Current plan</div>-->
    <!--            <div class="plan__name">Pro · $15/mo</div>-->
    <!--        </div>-->
    <!--        <button class="plan__manage">Manage</button>-->
    <!--    </section>-->

    <!-- tutorials -->
    <section class="settings" aria-label="Guides and tutorials">
        <a class="settings__row" href="/blog/how-to-create-a-restaurant-menu" target="_blank" rel="noopener">
          <span class="settings__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 19V6a2 2 0 0 1 2-2h13v13H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h13" stroke="#3F3F46" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9 8h6M9 11.5h4" stroke="#3F3F46" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
            <span class="settings__label">
                How to create your menu
                <span class="settings__tag">Tutorial</span>
            </span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m9 6 6 6-6 6" stroke="#C4C4CC" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
        </a>
        <a class="settings__row" href="/blog/how-to-print-menus-for-restaurants" target="_blank" rel="noopener">
          <span class="settings__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 8V4h10v4M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 14h10v6H7v-6Z" stroke="#3F3F46" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
          </span>
            <span class="settings__label">
                How to print your menu
                <span class="settings__tag">Tutorial</span>
            </span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m9 6 6 6-6 6" stroke="#C4C4CC" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
        </a>
    </section>

    @if (supportEmail) {
        <section class="settings">
            <a class="settings__row" [href]="supportHref" [attr.aria-label]="'Contact support at ' + supportEmail">
              <span class="settings__icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="12" cy="12" r="8.5" stroke="#3F3F46" stroke-width="1.7"/>
                  <path d="M9.5 9.5a2.5 2.5 0 0 1 3.7-1.5c1.3.8 1 2.3-.2 3-.6.4-1 .8-1 1.5" stroke="#3F3F46" stroke-width="1.7"
                        stroke-linecap="round"/>
                  <circle cx="12" cy="16" r="1" fill="#3F3F46"/>
                </svg>
              </span>
                <span class="settings__label">Help &amp; support</span>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="m9 6 6 6-6 6" stroke="#C4C4CC" stroke-width="2" stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
            </a>
        </section>
    }

    <button class="logout" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 12H4m0 0 4-4m-4 4 4 4M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"
                  stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Log out
    </button>

    <div class="account__version">NexMenus · v0.1.0</div>
</div>
