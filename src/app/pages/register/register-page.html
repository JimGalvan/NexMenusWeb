<div class="auth">
  <div class="auth__card scrollarea">
    <a routerLink="/" class="auth__brand"><app-brand-logo [size]="21" /></a>

    <header class="auth__head">
      <h1>Create your account</h1>
      <p>Get your menu online — free to launch, no card needed.</p>
    </header>

    <form class="auth__form" (ngSubmit)="submit()">
      <div class="auth__field">
        <label class="nx-label" for="email">Email</label>
        <input id="email" class="nx-input" type="email" autocomplete="email"
               placeholder="you@restaurant.com"
               [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" />
      </div>

      <div class="auth__field">
        <label class="nx-label" for="password">Password</label>
        <div class="auth__pw">
          <input id="password" class="nx-input" [type]="showPassword() ? 'text' : 'password'"
                 autocomplete="new-password" placeholder="Create a password"
                 [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" />
          <button type="button" class="auth__pw-toggle" (click)="togglePassword()"
                  [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            @if (showPassword()) {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="#9A9AA3" stroke-width="1.7"/>
                <circle cx="12" cy="12" r="3" stroke="#9A9AA3" stroke-width="1.7"/>
                <path d="m4 3 16 18" stroke="#9A9AA3" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            } @else {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="#9A9AA3" stroke-width="1.7"/>
                <circle cx="12" cy="12" r="3" stroke="#9A9AA3" stroke-width="1.7"/>
              </svg>
            }
          </button>
        </div>
      </div>

      @if (error()) { <p class="auth__error">{{ error() }}</p> }

      <button type="submit" class="nx-btn nx-btn--primary auth__submit" [disabled]="loading()">
        {{ loading() ? 'Creating account…' : 'Create account' }}
      </button>

      <p class="auth__terms">
        By creating an account you agree to our
        <a routerLink="/terms">Terms</a> &amp; <a routerLink="/privacy">Privacy Policy</a>.
      </p>
    </form>

    <div class="auth__foot">
      Already have an account? <a routerLink="/login">Log in</a>
    </div>

    @if (supportEmail) {
      <div class="auth__support">
        Having issue? <a [href]="supportHref">{{ supportEmail }}</a>
      </div>
    }
  </div>
</div>
