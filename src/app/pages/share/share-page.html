<div class="share">
  <header class="share__head">
    <h1>QR &amp; Share</h1>
    <p>Print your code or share your menu link.</p>
  </header>

  <!-- menu selector -->
  <button class="selector" [class.selector--static]="menus().length <= 1"
          [disabled]="menus().length <= 1" (click)="openPicker()">
    @if (menu()?.logoUrl) {
      <img class="selector__logo selector__logo--img" [src]="menu()!.logoUrl" alt="Menu logo" />
    } @else {
      <div class="selector__logo">{{ initials() }}</div>
    }
    <span class="selector__name">{{ menu()?.name ?? 'No menu yet' }}</span>
    @if (menus().length > 1) {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m7 10 5 5 5-5" stroke="#9A9AA3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    }
  </button>

  <!-- QR card -->
  <section class="qr-card">
    <div class="qr-card__frame">
      <app-qr-code [data]="qrUrl()" [size]="168" />
    </div>
    <div class="qr-card__title">Scan to view menu</div>
    <div class="qr-card__url">{{ publicUrl() }}</div>
    <button class="nx-btn nx-btn--primary qr-card__dl" (click)="downloadQr()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"
              stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Download QR (PNG)
    </button>
    <button class="nx-btn nx-btn--ghost qr-card__print" (click)="printQr()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 9V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M6 18H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1"
              stroke="#27272A" stroke-width="1.8" stroke-linejoin="round"/>
        <rect x="7" y="15" width="10" height="6" rx="1" stroke="#27272A" stroke-width="1.8"/>
      </svg>
      Print table tents
    </button>
  </section>

  <!-- share link -->
  <section class="link-card">
    <div class="link-card__label">Share link</div>
    <button class="link-row" (click)="copyLink()">
      <span class="link-row__url">{{ publicUrl() }}</span>
      <span class="link-row__copy">Copy</span>
    </button>
    <div class="link-card__grid">
      <button class="social" (click)="copyLink()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" stroke="#27272A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" stroke="#27272A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Copy link</span>
      </button>
    </div>
  </section>
</div>

@if (pickerOpen()) {
  <app-bottom-sheet (dismiss)="pickerOpen.set(false)">
    <div class="picker">
      <h2>Choose a menu</h2>
      <p>Pick which menu to generate a QR code and share link for.</p>
      <div class="picker__list">
        @for (m of menus(); track m.id) {
          <button class="picker__row" [class.is-active]="m.id === menu()?.id" (click)="selectMenu(m)">
            @if (m.logoUrl) {
              <img class="picker__logo picker__logo--img" [src]="m.logoUrl" [alt]="m.name + ' logo'" />
            } @else {
              <div class="picker__logo">{{ menuInitials(m.name) }}</div>
            }
            <span class="picker__name">{{ m.name }}</span>
            @if (m.id === menu()?.id) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m5 12 5 5L20 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            }
          </button>
        }
      </div>
    </div>
  </app-bottom-sheet>
}

@if (toast()) {
  <div class="toast">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="m5 12 5 5L20 6" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    {{ toast() }}
  </div>
}
