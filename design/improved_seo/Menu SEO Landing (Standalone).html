  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- hours + location -->\n  <div style=\"margin:0 18px 4px;border:1px solid rgba(0,0,0,0.08);border-radius:14px;padding:14px 16px;background:#FAFAFB;\">\n    <h2 style=\"font-size:13px;font-weight:800;margin:0 0 9px;\">Hours &amp; Location<\u002Fh2>\n    <div style=\"display:flex;justify-content:space-between;font-size:12.5px;color:#52525B;padding:3px 0;\"><span>Mon – Sat<\u002Fspan><span style=\"font-weight:700;color:#18181B;\">9:00am – 10:00pm<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;font-size:12.5px;color:#52525B;padding:3px 0;\"><span>Sunday<\u002Fspan><span style=\"font-weight:700;color:#9A9AA3;\">Closed<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:12.5px;color:#52525B;margin-top:10px;line-height:1.55;\">123 Main Street, Demo City, CA 91234<br><a href=\"tel:7779996666\" style=\"{{ aLink }}\">777-999-6666<\u002Fa><\u002Fdiv>\n    <a href=\"#faq\" style=\"{{ faqJumpStyle }}\">\n      <span>Have a question?<\u002Fspan>\n      <span style=\"font-weight:800;\">Jump to FAQ<\u002Fspan>\n      <span style=\"{{ faqJumpArrow }}\">↓<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n\n  <!-- menu (crawlable text) -->\n  <div style=\"padding:6px 18px 18px;\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;\">\n      <h2 style=\"font-size:16px;font-weight:800;letter-spacing:-0.01em;margin:0;\">Menu<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;\">\n      <sc-for list=\"{{ menuTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.onSelect }}\" style=\"{{ t.style }}\">{{ t.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ menuCats }}\" as=\"cat\" hint-placeholder-count=\"4\">\n      <div style=\"{{ cat.sectionStyle }}\">\n        <div style=\"display:flex;flex-direction:column;margin-top:10px;max-height:420px;overflow-y:auto;padding-right:10px;\">\n          <sc-for list=\"{{ cat.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:11px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.05);\">\n              <img src=\"{{ it.img }}\" alt=\"{{ it.alt }}\" loading=\"lazy\" width=\"52\" height=\"52\" style=\"width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:#F4F4F5;\">\n              <div style=\"flex:1;min-width:0;\">\n                <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;\">\n                  <span style=\"font-size:14px;font-weight:700;flex:1;min-width:0;\">{{ it.name }}<\u002Fspan>\n                  <span style=\"{{ aPrice }}white-space:nowrap;flex:0 0 auto;\">{{ it.price }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#71717A;line-height:1.45;margin-top:2px;\">{{ it.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- about -->\n  <div style=\"margin:0 18px;padding:16px 0;border-top:1px solid rgba(0,0,0,0.07);\">\n    <h2 style=\"font-size:15px;font-weight:800;margin:0 0 8px;\">About Ocean &amp; Farm<\u002Fh2>\n    <p style=\"font-size:12.5px;color:#52525B;line-height:1.6;margin:0;text-wrap:pretty;\">A neighborhood spot serving fresh, California-inspired plates — wild-caught seafood, local produce and house-made pasta — in the heart of Demo City since 2019.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- FAQ -->\n  <div id=\"faq\" style=\"margin:0 18px;padding:16px 0;border-top:1px solid rgba(0,0,0,0.07);scroll-margin-top:16px;\">\n    <h2 style=\"font-size:15px;font-weight:800;margin:0 0 6px;\">Frequently asked questions<\u002Fh2>\n    <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"3\">\n      <div style=\"paddi false, shareLabel: '', activeMenuCat: 'Starters' };\n  onShare() {\n    const url = 'https://nexmenus.com/menu/demo-city/ocean-and-farm';\n    const data = { title: 'Ocean & Farm — Menu & Prices', text: 'Check out the menu at Ocean & Farm', url };\n    if (navigator.share) {\n      navigator.share(data).catch(() => {});\n    } else if (navigator.clipboard) {\n      navigator.clipboard.writeText(url);\n      this.setState({ shareLabel: 'Link copied!' });\n      clearTimeout(this._shareT);\n      this._shareT = setTimeout(() => this.setState({ shareLabel: '' }), 1800);\n    }\n  }\n  renderVals() {\n    const accent = this.props.accent ?? '#0F6E5F';\n    const hasCover = this.props.hasCoverPhoto ?? true;\n    const noCover = !hasCover;\n    const activeMenuCat = this.state.activeMenuCat;\n    const resKey = (id) => 'img_' + id.split('-')[0];\n    const u = (id) => (window.__resources && window.__resources[resKey(id)]) || `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=200&q=70`;\n    const mk = (arr) => arr.map(([name, price, desc, img]) => ({\n      name, desc, price: '$' + price,\n      img: img ? u(img) : '',\n      alt: name + ' at Ocean & Farm',\n    }));\n\n    return {\n      hasCover,\n      noCover,\n      headerWrapStyle: { padding: hasCover ? '0 18px 16px' : '20px 18px 16px', marginTop: hasCover ? '-34px' : '0', position: 'relative' },\n      headerTopRow: { display: 'flex', alignItems: 'center', gap: '14px' },\n      highlightBadges: ['Family friendly', 'Local pickup', 'Vegetarian options'],\n      infoOpen: this.state.infoOpen,\n      onInfoToggle: () => this.setState((s) => ({ infoOpen: !s.infoOpen })),\n      onShare: () => this.onShare(),\n      shareLabel: this.state.shareLabel,\n      shareLabelVisible: !!this.state.shareLabel,\n      infoIconBtn: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', padding: '0 14px', borderRadius: '12px', background: '#F4F4F5', border: 'none', cursor: 'pointer', fontSize: '1  & Farm take reservations?', a: 'Yes — call 777-999-6666 or reserve online. Walk-ins welcome at the bar.' },\n        { q: 'Is there parking near Ocean & Farm?', a: 'Free street parking on Main Street plus a public lot one block south.' },\n        { q: 'Does Ocean & Farm offer vegetarian options?', a: 'Yes — several starters, pastas and salads are vegetarian; ask about vegan swaps.' },\n      ],\n      aLogo: { width: hasCover ? '52px' : '60px', height: hasCover ? '52px' : '60px', borderRadius: '16px', background: accent, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: hasCover ? '14px' : '16px', boxShadow: hasCover ? '0 0 0 3px #fff' : 'none', flex: '0 0 auto' },\n      aBtn: { display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '11px 8px', borderRadius: '12px', background: accent, color: '#fff', fontSize: '13px', fontWeight: 700 },\n      aGhostBtn: { display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '11px 8px', borderRadius: '12px', background: '#F4F4F5', color: '#3F3F46', fontSize: '13px', fontWeight: 700 },\n      aPrice: { fontWeight: 800, fontSize: '13.5px', color: accent, flex: '0 0 auto', fontVariantNumeric: 'tabular-nums' },\n      aLink: { color: accent, fontWeight: 700 },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
