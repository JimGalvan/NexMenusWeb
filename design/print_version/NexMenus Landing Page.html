document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

=\"display:flex;align-items:center;justify-content:center;gap:14px;margin-top:32px;\">\n        <a href=\"#\" style=\"background:#fff;color:#22224b;font-size:15.5px;font-weight:700;padding:16px 30px;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,0.25);\">Start free<\u002Fa>\n        <a href=\"Menu Redesign.dc.html\" style=\"color:#fff;font-size:15px;font-weight:700;padding:16px 14px;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,0.25);border-radius:13px;\">See a live menu<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ FOOTER ============ -->\n  <div style=\"background:#15152e;color:#fff;margin-top:90px;\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:60px 32px 34px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px;\">\n      <div>\n        <div style=\"font-size:20px;font-weight:800;letter-spacing:-0.02em;\"><span style=\"color:#fff;\">Nex<\u002Fspan><span style=\"color:#7c7ca8;\">Menus<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.6;color:rgba(255,255,255,0.6);margin:14px 0 0;max-width:260px;\">The fastest way to put your restaurant's menu online and keep it up to date — right from your phone.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.45);\">Product<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:16px;font-size:14px;color:rgba(255,255,255,0.75);\">\n          <a href=\"#features\">Features<\u002Fa><a href=\"#templates\">Templates<\u002Fa><a href=\"#pricing\">Pricing<\u002Fa><a href=\"#how\">How it works<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.45);\">Company<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:16px;font-size:14px;color:rgba(255,255,255,0.75);\">\n          <a href=\"#\">About<\u002Fa><a href=\"#\">Blog<\u002Fa><a href=\"#\">Careers<\u002Fa><a href=\"#\">Contact<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.45);\">Get started<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:16px;font-size:14px;color:rgba(255,255,255,0.75);\">\n          <a href=\"#\">Create your menu<\u002Fa><a href=\"#\">Log in<\u002Fa><a href=\"#\">Help center<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(255,255,255,0.1);\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:rgba(255,255,255,0.5);\">\n        <span>© 2026 NexMenus. All rights reserved.<\u002Fspan>\n        <span style=\"display:flex;gap:22px;\"><a href=\"#\">Privacy<\u002Fa><a href=\"#\">Terms<\u002Fa><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { billing: 'annual', openFaq: 0 };\n  renderVals() {\n    const navy = '#22224b';\n    const annual = this.state.billing === 'annual';\n    const seg = (on) => ({ padding:'9px 18px', borderRadius:'999px', fontSize:'13.5px', fontWeight:700, cursor:'pointer', border:'none', background: on ? '#fff' : 'transparent', color: on ? navy : '#71717A', boxShadow: on ? '0 1px 3px rgba(0,0,0,0.14)' : 'none', transition:'all .15s' });\n    const faqData = [\n      { q:'Do my customers need to download an app?', a:'No. They scan the QR code or tap your link and your menu opens instantly in their phone browser — nothing to install.' },\n      { q:'Can I really update the menu from my phone?', a:'Yes. Edit prices, add specials, upload photos, or mark items sold out from your phone. Changes go live the moment you save.' },\n      { q:'Is there really a free plan?', a:'Absolutely — launch a full menu with a QR code for free. Upgrade only when you want unlimited items, your own branding, or multiple locations.' },\n      { q:'Can I match my restaurant\\u2019s branding?', a:'Pick your accent color and add your logo. On paid plans you can also remove the NexMenus badge and use your own custom link.' },\n      { q:'What if I have more than one location?', a:'The Business plan supports multiple menus and locations from one account, plus scan analytics and priority support.' },\n    ];\n    const faqs = faqData.map((f, i) => ({\n      q: f.q,\n      a: f.a,\n      open: this.state.openFaq === i,\n      onToggle: () => this.setState((s) => ({ openFaq: s.openFaq === i ? null : i })),\n      iconStyle: { transform: this.state.openFaq === i ? 'rotate(45deg)' : 'rotate(0deg)', transition:'transform .2s', fontSize:'24px', color: navy, lineHeight:1, fontWeight:300, flex:'0 0 auto' },\n      cardStyle: { background:'#fff', border:'1px solid rgba(0,0,0,0.08)', borderRadius:'16px', padding:'2px 24px', boxShadow: this.state.openFaq === i ? '0 10px 30px rgba(0,0,0,0.07)' : 'none', transition:'box-shadow .2s' },\n    }));\n    return {\n      onMonthly: () => this.setState({ billing: 'monthly' }),\n      onAnnual: () => this.setState({ billing: 'annual' }),\n      segMonthlyStyle: seg(!annual),\n      segAnnualStyle: seg(annual),\n      proPrice: annual ? '15' : '19',\n      bizPrice: annual ? '31' : '39',\n      periodNote: annual ? '/mo billed yearly' : '/mo',\n      faqs,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
