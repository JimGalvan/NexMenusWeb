<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
a{text-decoration:none;color:inherit;}
input::placeholder{color:#A1A1AA;}
.scrollarea{scrollbar-width:none;-ms-overflow-style:none;}
.scrollarea::-webkit-scrollbar{display:none;}
</style>
</helmet>

<div style="min-height:100vh;background:#E9E9EC;font-family:'Manrope',system-ui,sans-serif;color:#18181B;display:flex;flex-direction:column;align-items:center;padding:40px 20px 60px;">

  <div style="margin-bottom:20px;text-align:center;">
    <div style="font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#A1A1AA;">NexMenus · Log in</div>
  </div>

  <!-- PHONE -->
  <div style="width:380px;height:812px;border-radius:42px;background:#fff;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(20,20,40,0.18),0 0 0 1px rgba(0,0,0,0.05);display:flex;flex-direction:column;">
    <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:98px;height:27px;border-radius:16px;background:#000;z-index:40;"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 24px 7px;flex:0 0 auto;">
      <span style="font-size:14px;font-weight:700;">9:41</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="0.6" fill="#18181B"/><rect x="4.5" y="4.5" width="3" height="6.5" rx="0.6" fill="#18181B"/><rect x="9" y="2" width="3" height="9" rx="0.6" fill="#18181B"/><rect x="13.5" y="0" width="3" height="11" rx="0.6" fill="#18181B"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" stroke="#18181B" stroke-opacity="0.4" fill="none"/><rect x="2" y="2" width="17" height="8" rx="1.8" fill="#18181B"/><rect x="22" y="4" width="1.6" height="4" rx="0.8" fill="#18181B" fill-opacity="0.5"/></svg>
      </div>
    </div>

    <div class="scrollarea" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:18px 26px 34px;">
      <div style="font-size:21px;font-weight:800;letter-spacing:-0.02em;"><span style="color:#22224b;">Nex</span><span style="color:#9A9AA3;">Menus</span></div>

      <div style="margin-top:36px;">
        <h1 style="font-size:27px;font-weight:800;letter-spacing:-0.02em;margin:0;">Welcome back</h1>
        <p style="font-size:14.5px;color:#71717A;margin:9px 0 0;line-height:1.5;">Log in to manage your menu and QR code.</p>
      </div>

      <button style="width:100%;margin-top:26px;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:1.5px solid #E4E4E7;border-radius:13px;background:#fff;font-size:14.5px;font-weight:700;color:#27272A;cursor:pointer;font-family:inherit;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38Z"/></svg>
        Continue with Google
      </button>

      <div style="display:flex;align-items:center;gap:14px;margin:22px 0;">
        <div style="flex:1;height:1px;background:rgba(0,0,0,0.09);"></div>
        <span style="font-size:12px;color:#A1A1AA;font-weight:600;">or with email</span>
        <div style="flex:1;height:1px;background:rgba(0,0,0,0.09);"></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px;">
        <div>
          <label style="font-size:13px;font-weight:700;color:#3F3F46;">Email</label>
          <input type="email" placeholder="you@restaurant.com" style="width:100%;margin-top:8px;padding:14px;border:1.5px solid #E4E4E7;border-radius:13px;font-size:15px;font-family:inherit;outline:none;" style-focus="{{ focusStyle }}" />
        </div>
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <label style="font-size:13px;font-weight:700;color:#3F3F46;">Password</label>
            <a href="#" style="font-size:12.5px;font-weight:700;color:#22224b;">Forgot?</a>
          </div>
          <div style="position:relative;margin-top:8px;">
            <input type="{{ pwType }}" placeholder="••••••••" style="width:100%;padding:14px 48px 14px 14px;border:1.5px solid #E4E4E7;border-radius:13px;font-size:15px;font-family:inherit;outline:none;" style-focus="{{ focusStyle }}" />
            <button onClick="{{ onToggle }}" style="position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;">
              <sc-if value="{{ showPw }}" hint-placeholder-val="{{ false }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="#9A9AA3" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="#9A9AA3" stroke-width="1.7"/></svg>
              </sc-if>
              <sc-if value="{{ hidePw }}" hint-placeholder-val="{{ true }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="#9A9AA3" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="#9A9AA3" stroke-width="1.7"/><path d="m4 3 16 18" stroke="#9A9AA3" stroke-width="1.7" stroke-linecap="round"/></svg>
              </sc-if>
            </button>
          </div>
        </div>
        <button style="width:100%;margin-top:6px;padding:16px;border:none;border-radius:13px;background:#22224b;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 10px 24px rgba(34,34,75,0.24);">Log in</button>
      </div>

      <div style="flex:1;min-height:24px;"></div>
      <div style="text-align:center;font-size:14px;color:#71717A;">New to NexMenus? <a href="Register.dc.html" style="color:#22224b;font-weight:700;">Create an account</a></div>
    </div>

    <div style="position:absolute;bottom:0;left:0;right:0;height:30px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;pointer-events:none;">
      <div style="width:130px;height:5px;border-radius:99px;background:rgba(0,0,0,0.22);"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { show: false };
  renderVals() {
    return {
      pwType: this.state.show ? 'text' : 'password',
      showPw: this.state.show,
      hidePw: !this.state.show,
      onToggle: () => this.setState((s) => ({ show: !s.show })),
      focusStyle: { border: '1.5px solid #22224b', boxShadow: '0 0 0 3px rgba(34,34,75,0.1)' },
    };
  }
}
</script>
</body>
</html>
